# Building Gadgets 2: a native trait mod (docs/native-mods.md, "Trait mods").
#
# `api/` is an ordinary Rust crate implementing `horizon_client::mod_api::Hooks`,
# which the launcher links into the game it builds. There are no `[[injection]]`
# or `[[module]]` entries: every part of the Java mod maps to a named hook point,
# so nothing of the game's source has to be rewritten. The reasoning, and the
# hook for each part of the Java mod, are in ../../docs/hook-map.md.
#
# Build it with
#   horizon-launcher native-build <this folder> --instance <instance> --trust-native-code
# and check it first, without a native build, with
#   python tools/check_bundle.py
#   python tools/local_check.py --tests
[mod]
id = "buildinggadgets2"
version = "0.1.0"

# Unpinned on purpose. The mod hooks only Horizon's named hook points, so
# `hooks` in horizon-native.json names the hook-point API it needs and a build
# from this folder compiles against whatever Horizon the instance plays.
#
# A *published* file is different: its two manifests must name the same commit,
# so tools/pack_mod.py adds `[compatibility] horizon_revision` to the copy it
# packs, as the launcher does to its own copy. This file stays unpinned.
# [compatibility]
# horizon_revision = "<40 hex digits>"

[api]
path = "api"

# The content mod is not loaded from here: tools/pack_mod.py puts ../../bg2-content
# and this bundle into one combined .hmod, which Horizon reads as content plus
# code (docs/api/mod-files.md). So there is no data/bg2-content.hmod to carry,
# and no native_data! call to load it — the workaround AE2's port needs.
